name: Desktop checks

on:
  pull_request:
  push:
    branches: [main, 'feature/windows-agent-office']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Setup and provenance regression tests
        run: python -m unittest -v test_windows.py test_windows_build.py test_windows_scripts.py
      - name: Existing Linux setup regression tests
        if: runner.os == 'Linux'
        run: python -m unittest -v test_install.py
      - name: Prepare verified source and both patches
        run: python windows_build.py --prepare-only
      - name: Frontend and protocol regression tests
        shell: pwsh
        run: |
          $version = (Get-Content source-lock.json | ConvertFrom-Json).version
          Set-Location ".build/source-windows-$version/windows"
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/typescript/bin/tsc --noEmit
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/vite/bin/vite.js build
          exit $LASTEXITCODE
      - name: Bash syntax
        if: runner.os == 'Linux'
        run: bash -n install.sh build.sh
      - name: Relay tests on the host platform
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $version = (Get-Content source-lock.json | ConvertFrom-Json).version
          Set-Location ".build/source-windows-$version/windows"
          cargo test --locked -p coucou-hook
          exit $LASTEXITCODE

  windows-native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Rust toolchain
        run: rustup update stable --no-self-update
      - name: Native application and relay build, without installing
        run: python windows_build.py
      - name: Verify build provenance
        run: python windows_build.py --verify-release
